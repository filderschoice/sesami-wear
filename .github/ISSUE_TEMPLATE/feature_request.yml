name: 機能の要望・改善提案
description: 新しい機能や既存機能の改善を提案する場合はこちら
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ご提案ありがとうございます。個人が余暇に開発しているプロジェクトのため、
        いただいた提案すべてに対応できるとは限りません。あらかじめご了承ください。

        本アプリの設計方針（secretKeyをウォッチ側へ保持しない、広告・解析SDKを組み込まない等）は
        [CONTRIBUTING.md](https://github.com/filderschoice/sesami-wear/blob/main/CONTRIBUTING.md)
        の「受け入れの判断基準」に記載しています。

  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: どのような場面で困っているかを記載してください。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する機能・改善内容
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 他の方法で回避できるか、試した内容があれば記載してください。
    validations:
      required: false

  - type: dropdown
    id: contribution
    attributes:
      label: 実装への参加意思
      options:
        - 提案のみ（実装は希望しない）
        - 自分でPull Requestを作成したい
        - 相談しながら実装を検討したい
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 補足情報
    validations:
      required: false
