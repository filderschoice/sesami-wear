config:
  MD013:
    line_length: 120
    code_blocks: false
    tables: false
  MD060: false
  # docs/RELEASE_NOTES.md はバージョンごとに「新機能」「改善」等の同名見出しを繰り返す構成
  # （同ファイル「運用ルール」参照）。同一階層内での重複のみを検出対象とする。
  MD024:
    siblings_only: true
# .gitignore で除外したファイル（ローカル専用メモ docs/**/*.local.md 等）とビルド生成物は対象外。
# git 管理対象の *.md 件数（品質ゲートの合否基準）と一致させるため
gitignore: true
ignores:
  - "**/build/**"
  - "**/node_modules/**"
