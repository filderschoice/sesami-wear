<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-labelledby="t">
  <title id="t">Sesami Wear のアイコン</title>
  <!-- アプリのランチャーアイコン（mobile/src/main/res/drawable/ic_launcher_*.xml）と同じ意匠 -->
  <rect width="108" height="108" rx="24" fill="#1E3A5F"/>
  <g fill="none" stroke="#C99A46" stroke-linecap="round">
    <!-- コンプリケーション風のリング（下部に隙間）。trimPath の範囲を円弧に置き換えたもの -->
    <path d="M30.88,73.12 A30,30 0 1 1 77.12,73.12" stroke-width="4" stroke-opacity="0.55"/>
    <!-- 南京錠のシャックル -->
    <path d="M43,58 L43,49 A11,11 0 0 1 65,49 L65,58" stroke-width="6"/>
    <!-- ワイヤレス波 -->
    <path d="M72,40 A7,7 0 0 1 79,47" stroke-width="5"/>
    <path d="M74,31 A13,13 0 0 1 83,41" stroke-width="5"/>
  </g>
  <!-- 南京錠の本体と鍵穴 -->
  <path fill="#C99A46" d="M42,58 L66,58 Q71,58 71,63 L71,81 Q71,86 66,86 L42,86 Q37,86 37,81 L37,63 Q37,58 42,58 Z"/>
  <circle cx="54" cy="63.5" r="3.5" fill="#1E3A5F"/>
  <path fill="#1E3A5F" d="M52.5,67 L55.5,67 L56.5,78 L51.5,78 Z"/>
</svg>
